# Paket pertanyaan uji asisten chat -- Tahap 2 docs/kajian_agentic_workflow_fitur_ai.md.
# Dijalankan scripts/uji_chat.py. Jawaban kunci dihitung dari DB staging 7 Okt 2026;
# perbarui bila datanya diimpor ulang (lihat komentar "sumber" tiap butir).
#
# Kriteria (semua yang diisi harus lulus):
#   harus_memakai : SALAH SATU tabel/tool ini muncul di SQL/tool yang dijalankan model
#                   (tool resmi spt cari_usulan_inpres sah sbg sumber data, bukan hanya SQL)
#   aksi_wajib    : SEMUA aksi UI ini dipancarkan (tampilkan_tabel, buat_grafik, ...)
#   angka         : tiap angka harus muncul di jawaban (toleransi relatif `rel` atau absolut `abs`;
#                   "48,8 triliun" / "Rp48.8 T" dikenali lewat satuan)
#   teks_wajib    : tiap teks muncul di jawaban (tidak peka huruf besar/kecil)
#   tidak_boleh   : regex yang TIDAK boleh muncul di jawaban
#   cek_db        : kueri yang hasilnya harus sama sebelum & sesudah (guardrail tulis-data)
# Pemeriksaan umum (semua butir): model tidak boleh berhenti dgn meminta konfirmasi,
# dan jawaban tidak boleh diberi peringatan "tabel karangan".

